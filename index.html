<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harkeerat Kaur - Personal Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    #dark-toggle {
      display: none;
    }

    .page-wrapper {
      background-color: #f4f6f9;
      color: #222222;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    #dark-toggle:checked ~ .page-wrapper {
      background-color: #181a1f;
      color: #f1f1f1;
    }

    #dark-toggle:checked ~ .page-wrapper header,
    #dark-toggle:checked ~ .page-wrapper .card,
    #dark-toggle:checked ~ .page-wrapper footer {
      background-color: #242730;
      border-color: #3a3f4b;
      color: #f1f1f1;
    }

    #dark-toggle:checked ~ .page-wrapper .nav-links a {
      color: #e0e0e0;
    }

    #dark-toggle:checked ~ .page-wrapper .nav-links a:hover {
      background-color: #2563eb;
      color: #ffffff;
    }

    #dark-toggle:checked ~ .page-wrapper input,
    #dark-toggle:checked ~ .page-wrapper textarea {
      background-color: #181a1f;
      color: #ffffff;
      border-color: #444957;
    }

    #dark-toggle:checked ~ .page-wrapper .theme-label::after {
      content: "Light Mode";
    }

    .theme-label::after {
      content: "Dark Mode";
    }
    header {
      background-color: #ffffff;
      border-bottom: 2px solid #e0e4e8;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1050px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #2563eb;
      text-decoration: none;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: #333333;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 4px;
    }

    .nav-links a:hover,
    .nav-links a:focus {
      background-color: #2563eb;
      color: #ffffff;
    }

    .theme-label {
      padding: 6px 12px;
      font-size: 13px;
      background-color: #2563eb;
      color: #ffffff;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
    }

    .theme-label:hover {
      background-color: #1d4ed8;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    section {
      padding: 45px 0;
      border-bottom: 1px solid #dce1e7;
      scroll-margin-top: 65px;
    }

    h2.section-heading {
      text-align: center;
      font-size: 26px;
      margin-bottom: 25px;
      color: #2563eb;
    }

    .home-section {
      background-color: #2563eb;
      color: #ffffff;
      text-align: center;
      padding: 70px 20px;
    }

    .avatar-circle {
      width: 90px;
      height: 90px;
      background-color: #ffffff;
      color: #2563eb;
      font-size: 32px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px auto;
    }

    .home-section h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .home-section .tagline {
      font-size: 18px;
      margin-bottom: 14px;
      color: #e0e7ff;
    }

    .home-section .welcome-text {
      max-width: 620px;
      margin: 0 auto 24px auto;
      font-size: 15px;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      background-color: #ffffff;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      margin: 5px;
      font-size: 14px;
    }

    .btn-secondary {
      background-color: #1e40af;
      color: #ffffff;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .card {
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .skill-box {
      margin-bottom: 15px;
    }

    .skill-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .bar-bg {
      width: 100%;
      height: 14px;
      background-color: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background-color: #2563eb;
    }

    .project-img-box {
      background-color: #dbeafe;
      color: #1e3a8a;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .tech-list {
      font-size: 13px;
      color: #2563eb;
      font-weight: bold;
      margin: 10px 0;
    }

    details {
      margin-top: 10px;
    }

    summary {
      background-color: #2563eb;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      display: inline-block;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    details p {
      margin-top: 10px;
      font-size: 13px;
      padding: 10px;
      background-color: rgba(37, 99, 235, 0.08);
      border-left: 3px solid #2563eb;
      border-radius: 4px;
    }
    .hobby-card {
      text-align: center;
    }

    .hobby-emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 9px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .submit-btn {
      background-color: #2563eb;
      color: #ffffff;
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .submit-btn:hover {
      background-color: #1d4ed8;
    }

    footer {
      background-color: #ffffff;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      border-top: 1px solid #d1d5db;
    }

    @media (max-width: 768px) {
      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }

      .navbar {
        flex-direction: column;
      }

      .nav-links {
        justify-content: center;
      }

      .home-section h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <input type="checkbox" id="dark-toggle">

  <div class="page-wrapper">

    <header>
      <div class="navbar">
        <a href="#home" class="logo">Harkeerat Kaur</a>
        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#education">Education</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#hobbies">Hobbies</a></li>
          <li><a href="#achievements">Achievements</a></li>
          <li><a href="#contact">Contact</a>
